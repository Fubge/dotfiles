# Shared design tokens: shapes, spacing and fonts used by every app.
[design]
rounding  = 12                       # windows, popups, notifications, lock screen
border    = 2                        # window / popup border width
gaps_in   = 8                        # between windows
gaps_out  = 16                       # between windows and screen edge (also bar margins)
font      = "JetBrainsMono Nerd Font"
font_ui   = "Noto Sans"
login_wallpaper = "default.png"   # relative to ~/Pictures/Wallpapers; first SDDM background only, then SUPER+W Shift+Enter

# Big centered overlays (wallpaper picker, shortcuts, clipboard) all share
# one frame: same size, same top edge, same search pill
overlay_width  = 1300
overlay_height = 760
overlay_top    = 70                  # px from the top of the screen

# Exceptions, both centered on the screen: the app launcher is a compact grid,
# the web search a single search pill
launcher_width  = 820
launcher_height = 540
websearch_width = 560
