# Shared design tokens: shapes, spacing and fonts used by every app.
[design]
rounding  = 12                       # windows, popups, notifications, lock screen
border    = 2                        # window / popup border width
gaps_in   = 8                        # between windows
gaps_out  = 16                       # between windows and screen edge (also bar margins)
font      = "JetBrainsMono Nerd Font"
font_ui   = "Noto Sans"
login_wallpaper = "default.png"   # relative to ~/Pictures/Wallpapers; first SDDM background only, then SUPER+W Shift+Enter

# Big overlays (app launcher, wallpaper picker, shortcuts, clipboard) share one
# frame: same size, centered on the screen, same search pill. Logical px
# (screen is 1440x900). The web search uses the width only (one row, centered).
overlay_width  = 1000
overlay_height = 640
