# Every visible text of the desktop (popups, bar, notifications, shortcut
# descriptions), German and English side by side. `chezmoi init` asks for the
# language (machine.lang); chezmoi renders it into ~/.config/popups/strings.json
# (Python: ~/.local/lib/popup/i18n.py, T("area.key")) and hypr/strings.lua.
#
#   key = { de = "…", en = "…" }     one text per language
#   key = "…"                        same in both
#   {name} is filled in by the code (str.format); key_one / key_other are
#   picked by count (Tn), {n} is the count.
# Code, comments and terminal tools stay English.

[strings.meta]
lang = { de = "de", en = "en" }

