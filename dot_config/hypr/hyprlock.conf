# Lock screen, colors match the rest of the desktop (see hypr/vars.lua)
$font   = JetBrainsMono Nerd Font
$accent = rgba(ff7f00ff)
$fg     = rgba(f8f8f2ff)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = $fg
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B"
    font_size = 22
    font_family = $font
    color = $fg
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    inner_color = rgba(1c2029cc)
    outer_color = $accent
    check_color = rgba(808aa2ff)
    fail_color  = rgba(ff5555ff)
    font_color  = $fg
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
