# Idle behaviour: dim -> lock -> screen off -> suspend
general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 2.5 min: dim screen (not to 0, OLED) and keyboard backlight off
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10 && brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume  = brightnessctl -r && brightnessctl -rd tpacpi::kbd_backlight
}

# 5 min: lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 min: suspend
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
