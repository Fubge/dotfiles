; GameMode: game-watch registers every game automatically (no `gamemoderun` needed).
[general]
renice=10
softrealtime=auto
inhibit_screensaver=1

; Leave the CPU governor alone: power-profiles-daemon handles CPU/platform
; power on this laptop, switched by the custom hooks below.
desiredgov=powersave
defaultgov=powersave

[custom]
start=~/.local/bin/gamemode-hook start
end=~/.local/bin/gamemode-hook end
