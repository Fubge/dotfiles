# Prompt: rounded pills in the desktop palette, command on the second line.
#    /  = left / right rounded caps (Nerd Font)
format = """
[](fg:#ff7f00)$os[](fg:#ff7f00) \
[](fg:#626f8c)$directory[](fg:#626f8c)\
$git_branch$git_status\
$fill$cmd_duration$status
$character"""

add_newline = true
command_timeout = 1000

[os]
disabled = false
style = "fg:#1c2029 bg:#ff7f00"
format = "[$symbol]($style)"
symbols.Arch = ""

[directory]
style = "fg:#f8f8f2 bg:#626f8c"
format = "[$path$read_only]($style)"
read_only = " \U000F033E"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
symbol = ""
style = "fg:#1c2029 bg:#808aa2"
format = " [](fg:#808aa2)[$symbol $branch]($style)"

[git_status]
style = "fg:#1c2029 bg:#808aa2"
format = "[( $all_status$ahead_behind)]($style)[](fg:#808aa2)"

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
style = "fg:#ffcc66"
format = "[\U000F0954 $duration]($style) "

[status]
disabled = false
style = "fg:#ff5555"
format = "[\U000F0159 $status]($style)"

[character]
success_symbol = "[❯](bold fg:#ff7f00)"
error_symbol = "[❯](bold fg:#ff5555)"
