# ~/.config/pacman/makepkg.conf - overrides /etc/makepkg.conf for packages
# built by hand (AUR via makepkg, no helper).

# Build on all cores (Arch's default is a single make job)
MAKEFLAGS="-j$(nproc)"

# Optimize for this CPU: these packages are only installed here
CFLAGS="${CFLAGS/-march=x86-64 -mtune=generic/-march=native}"
CXXFLAGS="${CXXFLAGS/-march=x86-64 -mtune=generic/-march=native}"
RUSTFLAGS="$RUSTFLAGS -C target-cpu=native"

# No separate *-debug packages (Arch's default builds one next to every package)
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

# Compressing the finished package is wasted time when it is installed right away
PKGEXT='.pkg.tar'
