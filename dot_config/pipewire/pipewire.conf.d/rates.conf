# Let devices follow the source's sample rate instead of resampling
# everything to 48 kHz: Spotify plays at 44.1 kHz, calls and games at
# 48 kHz, hi-res files at 96 kHz, each untouched when the device can do it
# (the Arctis Nova Pro Omni can). The default rate stays PipeWire's 48 kHz.
context.properties = {
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
}
