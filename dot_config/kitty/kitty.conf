# kitty - colors match the desktop palette (hypr/vars.lua)

font_family      JetBrainsMono Nerd Font
font_size        12.0

background_opacity   0.88
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
# small trail when the cursor jumps
cursor_trail 3
shell_integration enabled

# Remote control off: nothing needs it any more (the old /tmp socket was world-readable)
allow_remote_control no

# Tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round

# Colors ------------------------------------------------------------------
foreground            #f8f8f2
background            #1c2029
selection_foreground  #1c2029
selection_background  #808aa2
cursor                #ff7f00
cursor_text_color     #1c2029
url_color             #ffcc66
active_border_color   #ff7f00
inactive_border_color #626f8c
active_tab_foreground   #1c2029
active_tab_background   #ff7f00
inactive_tab_foreground #f8f8f2
inactive_tab_background #626f8c

# black, red, green, yellow, blue, magenta, cyan, white (normal / bright)
color0  #2a2f3a
color8  #626f8c
color1  #ff5555
color9  #ff7b7b
color2  #a6e3a1
color10 #c3f0bf
color3  #ffcc66
color11 #ffdd99
color4  #7aa2f7
color12 #9bb8ff
color5  #c49bff
color13 #d8bbff
color6  #7dcfff
color14 #a8e0ff
color7  #c0c4ce
color15 #f8f8f2
