# Wi-Fi power saving off: the card no longer naps between packets. Those naps
# make Miracast (TV on Wi-Fi Direct next to the home network) stutter and lag,
# because the TV then buffers more. Costs a little battery while Wi-Fi is on.
# 2 = disable, 3 = enable. Takes effect when a connection is (re)activated,
# e.g. at the next boot.
[connection]
wifi.powersave=2
