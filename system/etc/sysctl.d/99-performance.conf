# Desktop responsiveness tweaks (applied with `sysctl --system`).

# Swap is zram only (compressed RAM, see zram-generator): swapping to it is far
# cheaper than dropping file cache and re-reading it from disk, so prefer it.
# Values from the ArchWiki "zram" page (same as Fedora / Pop!_OS).
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# zram has no seek time: read one page at a time instead of 8-page clusters
vm.page-cluster = 0

# No NMI watchdog: frees a hardware perf counter and saves a little power
kernel.nmi_watchdog = 0

# Split-lock detection slows down some (mostly Windows) games by design;
# SteamOS turns the penalty off as well
kernel.split_lock_mitigate = 0
