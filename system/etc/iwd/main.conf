# iwd runs as NetworkManager's Wi-Fi backend; NetworkManager still does IP/DHCP/DNS.
[General]
EnableNetworkConfiguration=false

[Rank]
# Wi-Fi and Bluetooth share one radio on Intel cards: on 2.4 GHz they fight for
# airtime and Bluetooth audio stutters. Only use 2.4 GHz if 5 GHz is much worse.
BandModifier2_4GHz=0.5

[DriverQuirks]
# Keep the interface systemd created (wlp0s20f3) instead of letting iwd replace it with
# wlan0: saved NetworkManager profiles are bound to the old name and fail otherwise.
DefaultInterface=*
